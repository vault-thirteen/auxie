services:
  registry:
    image: registry:3
    container_name: registry
    restart: always
    ports:
      - "5000:5000"
    volumes:
      - type: bind
        # Path to the local (host) data folder.
        source: /home/username/Docker-Registry/registry_data
        target: /var/lib/registry
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
